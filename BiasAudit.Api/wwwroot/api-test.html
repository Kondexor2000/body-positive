<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bias Audit API - test client</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18231f;
      --muted: #5d6a64;
      --line: #d9ded9;
      --panel: #ffffff;
      --soft: #f4f7f4;
      --brand: #24564b;
      --accent: #8c5d32;
      --danger: #a6372f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--soft);
      color: var(--ink);
    }

    header {
      background: var(--brand);
      color: #fff;
      padding: 24px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
    }

    header p {
      margin: 0;
      color: #e7f0ec;
      max-width: 920px;
    }

    main {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 18px;
      letter-spacing: 0;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 11px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }

    textarea {
      min-height: 86px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: var(--brand);
      cursor: pointer;
    }

    button.secondary {
      background: var(--accent);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: end;
      flex-wrap: wrap;
    }

    .row > * {
      flex: 1 1 180px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .wide {
      grid-column: 1 / -1;
    }

    pre {
      margin: 0;
      min-height: 160px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      background: #111815;
      color: #ecf7f1;
      border-radius: 8px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.45;
    }

    iframe {
      width: 100%;
      min-height: 460px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .status {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .error {
      color: var(--danger);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bias Audit API - test client</h1>
    <p>Prosty klient HTML do sprawdzania health checka, uploadu audytu, pobierania statusu i renderowania raportu HTML.</p>
  </header>

  <main>
    <section>
      <h2>Konfiguracja</h2>
      <label for="baseUrl">Base URL</label>
      <input id="baseUrl" value="">

      <label for="apiKey">X-Api-Key</label>
      <input id="apiKey" value="dev-api-key-change-me">

      <div class="actions">
        <button id="healthBtn" type="button">Sprawdz /health</button>
        <button id="swaggerBtn" class="secondary" type="button">Otworz Swagger</button>
      </div>
      <div id="healthStatus" class="status"></div>
    </section>

    <section>
      <h2>Upload audytu</h2>
      <label for="file">Obraz</label>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp">

      <div class="row">
        <div>
          <label for="modelDecision">Decyzja modelu</label>
          <select id="modelDecision">
            <option value="">Brak</option>
            <option value="approved">approved</option>
            <option value="rejected">rejected</option>
            <option value="blocked">blocked</option>
            <option value="visible">visible</option>
          </select>
        </div>
        <div>
          <label for="cohort">Kohorta</label>
          <input id="cohort" placeholder="np. dobrowolnie podana kohorta testowa">
        </div>
      </div>

      <label for="notes">Notatki</label>
      <textarea id="notes" placeholder="np. test nadmoderacji neutralnego zdjecia"></textarea>

      <div class="actions">
        <button id="uploadBtn" type="button">Wyslij upload</button>
      </div>
      <div id="uploadStatus" class="status"></div>
    </section>

    <section>
      <h2>Status i raport</h2>
      <label for="auditId">Audit ID</label>
      <input id="auditId" placeholder="GUID zwrocony z uploadu">

      <div class="actions">
        <button id="statusBtn" type="button">Pobierz status</button>
        <button id="reportBtn" class="secondary" type="button">Pobierz raport</button>
      </div>
      <div id="reportStatus" class="status"></div>
    </section>

    <section class="wide">
      <h2>Odpowiedz API</h2>
      <pre id="output">Gotowe.</pre>
    </section>

    <section class="wide">
      <h2>Podglad raportu HTML</h2>
      <iframe id="reportFrame" title="Podglad raportu"></iframe>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const output = $("output");
    const reportFrame = $("reportFrame");

    $("baseUrl").value = window.location.origin;

    function apiUrl(path) {
      return $("baseUrl").value.replace(/\/$/, "") + path;
    }

    function apiHeaders(extra = {}) {
      return {
        "X-Api-Key": $("apiKey").value,
        ...extra
      };
    }

    function show(value) {
      if (typeof value === "string") {
        output.textContent = value;
        return;
      }
      output.textContent = JSON.stringify(value, null, 2);
    }

    async function readResponse(response) {
      const contentType = response.headers.get("content-type") || "";
      const body = contentType.includes("application/json")
        ? await response.json()
        : await response.text();

      return {
        ok: response.ok,
        status: response.status,
        statusText: response.statusText,
        body
      };
    }

    async function run(label, fn) {
      show(`${label}...`);
      try {
        const result = await fn();
        show(result);
        return result;
      } catch (error) {
        show({ error: error.message });
        throw error;
      }
    }

    $("healthBtn").addEventListener("click", async () => {
      const result = await run("Sprawdzanie /health", async () => {
        const response = await fetch(apiUrl("/health"));
        return readResponse(response);
      });
      $("healthStatus").textContent = result.ok ? "API dziala." : "Health check zwrocil blad.";
      $("healthStatus").className = result.ok ? "status" : "status error";
    });

    $("swaggerBtn").addEventListener("click", () => {
      window.open(apiUrl("/swagger"), "_blank", "noopener");
    });

    $("uploadBtn").addEventListener("click", async () => {
      const file = $("file").files[0];
      if (!file) {
        show({ error: "Wybierz plik obrazu." });
        return;
      }

      const form = new FormData();
      form.append("file", file);
      form.append("modelDecision", $("modelDecision").value);
      form.append("cohort", $("cohort").value);
      form.append("notes", $("notes").value);

      const result = await run("Wysylanie uploadu", async () => {
        const response = await fetch(apiUrl("/api/audits/upload"), {
          method: "POST",
          headers: apiHeaders(),
          body: form
        });
        return readResponse(response);
      });

      if (result.ok && result.body && result.body.id) {
        $("auditId").value = result.body.id;
        $("uploadStatus").textContent = "Upload przyjety do kolejki.";
        $("uploadStatus").className = "status";
      } else {
        $("uploadStatus").textContent = "Upload nie powiodl sie.";
        $("uploadStatus").className = "status error";
      }
    });

    $("statusBtn").addEventListener("click", async () => {
      const id = $("auditId").value.trim();
      if (!id) {
        show({ error: "Podaj Audit ID." });
        return;
      }

      await run("Pobieranie statusu", async () => {
        const response = await fetch(apiUrl(`/api/audits/${encodeURIComponent(id)}`), {
          headers: apiHeaders({ "Accept": "application/json" })
        });
        return readResponse(response);
      });
    });

    $("reportBtn").addEventListener("click", async () => {
      const id = $("auditId").value.trim();
      if (!id) {
        show({ error: "Podaj Audit ID." });
        return;
      }

      const result = await run("Pobieranie raportu", async () => {
        const response = await fetch(apiUrl(`/api/audits/${encodeURIComponent(id)}/report`), {
          headers: apiHeaders({ "Accept": "text/html" })
        });
        return readResponse(response);
      });

      if (result.ok && typeof result.body === "string") {
        reportFrame.srcdoc = result.body;
        $("reportStatus").textContent = "Raport zaladowany.";
        $("reportStatus").className = "status";
      } else {
        reportFrame.srcdoc = "";
        $("reportStatus").textContent = "Raport nie jest dostepny.";
        $("reportStatus").className = "status error";
      }
    });
  </script>
</body>
</html>
