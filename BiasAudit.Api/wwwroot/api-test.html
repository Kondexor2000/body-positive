<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bias Audit API Client</title>

<style>
:root {
  color-scheme: light;
  --ink: #18231f;
  --muted: #5d6a64;
  --line: #d9ded9;
  --panel: #ffffff;
  --soft: #f4f7f4;
  --brand: #24564b;
  --accent: #8c5d32;
  --danger: #a6372f;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: var(--soft);
  color: var(--ink);
}

header {
  background: var(--brand);
  color: white;
  padding: 20px;
}

main {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  border: 1px solid var(--line);
  border-radius: 6px;
}

button {
  margin-top: 10px;
  padding: 10px;
  border: 0;
  border-radius: 6px;
  background: var(--brand);
  color: white;
  font-weight: 600;
  cursor: pointer;
}

button.secondary {
  background: var(--accent);
}

pre {
  background: #111;
  color: #eee;
  padding: 12px;
  border-radius: 6px;
  overflow: auto;
}

.status { margin-top: 10px; color: var(--muted); }
.error { color: var(--danger); font-weight: 600; }
</style>
</head>

<body>

<header>
<h1>Bias Audit API Client</h1>
</header>

<main>

<!-- CONFIG -->
<section>
<h2>Konfiguracja</h2>

<input id="baseUrl" placeholder="API URL">
<input id="apiKey" placeholder="X-Api-Key">

<button onclick="health()">Health</button>

<div id="healthStatus" class="status"></div>
</section>

<!-- AUTH -->
<section>
<h2>Auth</h2>

<input id="username" placeholder="username">
<input id="email" placeholder="email">
<input id="password" type="password" placeholder="password">

<button onclick="register()">Register</button>
<button class="secondary" onclick="login()">Login</button>
<button onclick="logout()">Logout</button>
<button class="secondary" onclick="me()">Me</button>

<div id="authStatus" class="status"></div>
</section>

<!-- OUTPUT -->
<section style="grid-column:1/-1">
<h2>Output</h2>
<pre id="out">Ready</pre>
</section>

</main>

<script>

let token = localStorage.getItem("token") || "";

document.getElementById("baseUrl").value = window.location.origin;

function url(path) {
  return document.getElementById("baseUrl").value.replace(/\/$/, "") + path;
}

/* 🔥 FIX 1: ZAWSZE WYSYŁAJ API KEY */
function headers(json = false) {
  const h = {};

  const apiKey =
    (document.getElementById("apiKey")?.value || "").trim();

  h["X-Api-Key"] = apiKey || "dev-api-key-change-me";

  const token = localStorage.getItem("token");
  if (token) {
    h["Authorization"] = "Bearer " + token;
  }

  if (json) {
    h["Content-Type"] = "application/json";
  }

  return h;
}

function show(data) {
  document.getElementById("out").textContent =
    typeof data === "string"
      ? data
      : JSON.stringify(data, null, 2);
}

async function parse(res) {
  const text = await res.text();
  try { return JSON.parse(text); }
  catch { return text; }
}

/* HEALTH */
async function health() {
  const res = await fetch(url("/health"));
  const data = await parse(res);

  document.getElementById("healthStatus").textContent =
    res.ok ? "OK" : "ERROR";

  show(data);
}

/* REGISTER */
async function register() {
  const res = await fetch(url("/api/auth/register"), {
    method: "POST",
    headers: headers(true),
    body: JSON.stringify({
      username: username.value,
      email: email.value,
      password: password.value
    })
  });

  show(await parse(res));
}

/* LOGIN */
async function login() {
  const res = await fetch(url("/api/auth/login"), {
    method: "POST",
    headers: headers(true),
    body: JSON.stringify({
      username: username.value,
      password: password.value
    })
  });

  const data = await parse(res);

  // 🔥 FIX: backend = AccessToken
  const jwt = data.accessToken;

  if (res.ok && jwt) {
    localStorage.setItem("token", jwt);
    document.getElementById("authStatus").textContent = "Zalogowano";
  } else {
    document.getElementById("authStatus").textContent = "Błąd logowania";
  }

  show(data);
}

/* LOGOUT */
async function logout() {
  await fetch(url("/api/auth/logout"), {
    method: "POST",
    headers: headers()
  });

  token = "";
  localStorage.removeItem("token");

  document.getElementById("authStatus").textContent = "Wylogowano";
  show("logout");
}

/* ME */
async function me() {
  const res = await fetch(url("/api/auth/me"), {
    headers: headers()
  });

  show(await parse(res));
}

</script>

</body>
</html>
